<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOS Burgers</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="overflow-hidden">
    <div class="d-flex flex-nowrap">

        <div class="d-flex flex-column flex-shrink-0 p-3 bg-body-tertiary
            position-fixed top-0 start-0 vh-100" style="width: 280px;"> <a href="/"
                class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none"> <svg
                    class="bi pe-none me-2" width="40" height="32" aria-hidden="true">
                    <use xlink:href="#bootstrap"></use>
                </svg> <span class="fs-4">Burger BUG</span> </a>
            <hr>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item"> <a href="#" class="nav-link active" aria-current="page"> <svg
                            class="bi pe-none me-2" width="16" height="16" aria-hidden="true">
                            <use xlink:href="#home"></use>
                        </svg>
                        Home
                    </a> </li>
                <li> <a href="#" class="nav-link link-body-emphasis"> <svg class="bi pe-none me-2" width="16"
                            height="16" aria-hidden="true">
                            <use xlink:href="#speedometer2"></use>
                        </svg>
                        Reports
                    </a> </li>
                <li> <a href="#" class="nav-link link-body-emphasis"> <svg class="bi pe-none me-2" width="16"
                            height="16" aria-hidden="true">
                            <use xlink:href="#table"></use>
                        </svg>
                        Orders
                    </a> </li>
                <li> <a href="#" class="nav-link link-body-emphasis"> <svg class="bi pe-none me-2" width="16"
                            height="16" aria-hidden="true">
                            <use xlink:href="#grid"></use>
                        </svg>
                        Products
                    </a> </li>
                <li> <a href="#" class="nav-link link-body-emphasis"> <svg class="bi pe-none me-2" width="16"
                            height="16" aria-hidden="true">
                            <use xlink:href="#people-circle"></use>
                        </svg>
                        Customers
                    </a> </li>
            </ul>


        </div>

        <div class="bg-white border-bottom p-3
            position-fixed top-0" style="left:285px; right:395px; z-index:1030;">

            <div class="d-flex justify-content-between align-items-center mb-2">
                <h4 class="mb-0">Menu</h4>
                <input class="form-control w-50" placeholder="Search products...">
            </div>

            <!-- Category Tabs -->
            <ul class="nav nav-pills">
                <li class="nav-item"><a class="nav-link active" href="#">All Menu</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Burgers</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Beverages</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Appetizers</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Desserts</a></li>
            </ul>
        </div>




        <!-- Order Panel -->
        <div class="col-3 bg-white border-start p-3 
            d-flex flex-column 
            vh-100 position-fixed end-0 top-0 order-panel flex-grow-1 overflow-auto">
            <h5>Order Details</h5>
            <hr>

            <div id="orderItems"></div>

            <hr>
            <h6>Total : Rs <span id="total">0</span></h6>

            <button class="btn btn-warning w-100 mt-3">Proceed Payment</button>
        </div>

    </div>

    <script src="/assets/js/app.js"></script>
</body>

</html>
